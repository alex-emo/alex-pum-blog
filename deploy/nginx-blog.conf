# blog.pum.org.cn —— 放到 /etc/nginx/sites-available/blog 并软链到 sites-enabled
# 申请证书：certbot --nginx -d blog.pum.org.cn

upstream blog_app {
    server 127.0.0.1:8010;
    keepalive 16;
}

# HTTP 全量跳 HTTPS（certbot 会保留 .well-known 校验路径）
server {
    listen 80;
    listen [::]:80;
    server_name blog.pum.org.cn;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # Debian 12 自带 nginx 1.22：http2 只能跟在 listen 后面
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name blog.pum.org.cn;

    ssl_certificate     /etc/letsencrypt/live/blog.pum.org.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/blog.pum.org.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ---- 安全响应头 ----
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # ---- 压缩 ----
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json application/rss+xml application/xml image/svg+xml;

    access_log /var/log/nginx/blog.access.log;
    error_log  /var/log/nginx/blog.error.log warn;

    # 上传图片上限（后端限 10MB，这里留余量）
    client_max_body_size 12m;

    # ---- 静态资源：nginx 直接读文件，不经过 Python ----
    # 注意：这两个 location 里不要再写 add_header，
    # 否则 nginx 会丢掉 server 级的安全响应头（add_header 不继承）
    location /static/ {
        alias /srv/blog/app/static/;
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    location /media/ {
        alias /srv/blog/media/;
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    location = /favicon.ico {
        alias /srv/blog/app/static/favicon.svg;
        access_log off;
    }

    # 隐藏文件一律拒绝（.env / .git 等）
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ---- 应用 ----
    location / {
        proxy_pass http://blog_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_buffering on;
    }
}
