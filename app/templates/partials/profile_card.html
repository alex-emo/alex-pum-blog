{# 左栏个人卡：桌面 sticky，移动端压缩成一张横卡 #}
<aside class="sidebar">
  <div class="profile-card">
    <div class="profile-top">
      <img class="avatar" src="{{ asset_url(settings.site_avatar) }}" alt="" width="96" height="96" loading="lazy">
      <div class="profile-identity">
        <a class="profile-name" href="/">{{ settings.site_name }}</a>
        <p class="profile-signature">{{ settings.site_signature }}</p>
      </div>
    </div>

    <dl class="profile-stats">
      <div>
        <dt>文章</dt>
        <dd><a href="/">{{ stats.posts }}</a></dd>
      </div>
      <div>
        <dt>标签</dt>
        <dd><a href="/tags">{{ stats.tags }}</a></dd>
      </div>
    </dl>

    <form class="profile-search" action="/search" method="get" role="search">
      <label class="sr-only" for="sidebar-q">搜索文章</label>
      <input id="sidebar-q" type="search" name="q" value="{{ keyword|default('') }}" placeholder="搜索文章…" required>
      <button type="submit" aria-label="搜索">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l5 5"/></svg>
      </button>
    </form>

    <div class="profile-actions">
      <a class="rss-btn" href="/rss.xml">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="18" r="1.6" fill="currentColor"/><path d="M4 11a9 9 0 0 1 9 9M4 4.5a15.5 15.5 0 0 1 15.5 15.5"/></svg>
        RSS 订阅
      </a>

      <div class="profile-links">
        <a href="mailto:{{ settings.site_email }}" aria-label="邮箱：{{ settings.site_email }}" title="{{ settings.site_email }}">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5.5" width="18" height="13" rx="2"/><path d="M3.8 7 12 13.2 20.2 7"/></svg>
        </a>
        <a href="https://x.com/{{ settings.site_x }}" target="_blank" rel="noopener me" aria-label="X：@{{ settings.site_x }}" title="X：@{{ settings.site_x }}">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 4.5 19.5 19.5M19.5 4.5 4.5 19.5"/></svg>
        </a>
        <a href="https://t.me/{{ settings.site_telegram }}" target="_blank" rel="noopener" aria-label="Telegram：@{{ settings.site_telegram }}" title="Telegram：@{{ settings.site_telegram }}">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 4 3.5 11.2l5.3 1.9L11 20l3.2-4.7 5.2 3.5z"/><path d="M8.8 13.1 21 4"/></svg>
        </a>
      </div>
    </div>
  </div>
</aside>
